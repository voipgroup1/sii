name: build & deploy pages

# 编译、单测、打包、部署全在 GitHub 上跑，本地不需要 cargo target。
# 公开仓库的 Actions 分钟数免费。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署，避免并发覆盖
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # 必须和 Cargo.lock 里的 wasm-bindgen 版本一致，升级依赖时一起改
  WASM_BINDGEN_VERSION: 0.2.130

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # build.sh 默认把产物放 $HOME/.cache，runner 上没必要；固定到 workspace
      # 里的 target，rust-cache 才能命中
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install wasm-bindgen
        run: |
          set -euo pipefail
          url="https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "$url" -o /tmp/wasm-bindgen.tar.gz
          tar -xzf /tmp/wasm-bindgen.tar.gz -C /tmp
          sudo install -m 755 "/tmp/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/wasm-bindgen
          wasm-bindgen --version

      - name: Unit tests
        run: cargo test --release --lib

      - name: Build wasm + bindgen
        run: ./build.sh

      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp index.html worker.js dist/
          cp -r assets pkg dist/
          du -sh dist
          ls -l dist/pkg

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
