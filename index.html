<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>sii — WebGPU GIF 编辑器</title>
<!-- 中文字体 8.4 MB，wasm 启动后才开始取的话要串行等两次下载。
     这里提前拉一把，和 wasm 并行；wasm 里 fetch 同一个 URL 会命中缓存。 -->
<link rel="preload" href="assets/puhuiti-55-regular.ttf" as="fetch" crossorigin="anonymous">
<style>
  :root {
    --bg: #0b0b0e;
    --fg: #e8e8ee;
    --dim: #8b8b99;
    --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #sii-canvas {
    display: block; width: 100vw; height: 100vh;
    touch-action: none; outline: none; cursor: crosshair;
  }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: var(--bg); z-index: 40; text-align: center; padding: 24px;
  }
  #boot.hidden { display: none; }
  #boot .title { font-size: 22px; font-weight: 600; letter-spacing: .04em; }
  #boot .msg { color: var(--dim); max-width: 620px; white-space: pre-wrap; text-align: left; }
  #boot .msg.err { color: #ff7a7a; }
  .spinner {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid #26262e; border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #empty {
    position: fixed;
    /* 预览区中央：左边工具栏 190、右边面板 272、顶栏 52、底栏 104 */
    left: calc(190px + (100vw - 462px) / 2);
    top: calc(52px + (100vh - 156px) / 2);
    transform: translate(-50%, -50%);
    z-index: 5; pointer-events: none;
    display: none; text-align: center;
    color: #5a5a68; font-size: 14px; letter-spacing: .06em; line-height: 2;
  }
  #empty.on { display: block; }
  #empty b { color: #8b8b99; font-weight: 500; }
  #drop {
    position: fixed; inset: 0; z-index: 30; display: none;
    align-items: center; justify-content: center;
    background: rgba(11,11,14,.82);
    border: 2px dashed var(--accent); border-radius: 12px; margin: 12px;
    font-size: 18px; letter-spacing: .04em; pointer-events: none;
  }
  #drop.on { display: flex; }
  kbd {
    font: 11px/1 ui-monospace, monospace; background: #1b1b22;
    border: 1px solid #2c2c36; border-radius: 4px; padding: 2px 5px; color: var(--dim);
  }
</style>
</head>
<body>
<canvas id="sii-canvas"></canvas>

<input id="sii-file" type="file" accept="image/gif,image/*" hidden>
<input id="sii-audio" type="file" accept="audio/*" hidden>

<div id="drop">松手就打开</div>

<div id="empty">拖入 GIF 文件<br><b>或点左上角「打开 GIF」</b></div>

<div id="boot">
  <div class="title">sii</div>
  <div class="spinner" id="boot-spin"></div>
  <div class="msg" id="boot-msg">正在初始化 WebGPU…</div>
  <div class="msg" style="font-size:12px">
    <kbd>空格</kbd> 播放/暂停　<kbd>,</kbd> <kbd>.</kbd> 上一帧/下一帧　
    <kbd>-</kbd> <kbd>=</kbd> 缩放　<kbd>0</kbd> 适应　<kbd>Home</kbd> <kbd>End</kbd> 首/末帧
  </div>
</div>

<script type="module">
// =====================================================================
//  JS 侧只做三件事：读文件、写文件、拉 DuckDB。
//  所有解码 / 合成 / 编辑 / 编码都在 wasm 里，UI 也在 wasm 里画。
// =====================================================================

const bootEl  = document.getElementById('boot');
const bootMsg = document.getElementById('boot-msg');
const bootSpin= document.getElementById('boot-spin');
const dropEl  = document.getElementById('drop');
const emptyEl = document.getElementById('empty');
const fileEl  = document.getElementById('sii-file');
const audioEl = document.getElementById('sii-audio');

function setBoot(msg, isErr = false) {
  bootMsg.textContent = msg;
  bootMsg.classList.toggle('err', isErr);
  // 出错时要能把启动页重新叫回来（正常启动后它是隐藏的）
  bootEl.classList.remove('hidden');
}
function hideBoot() { bootEl.classList.add('hidden'); }

// ---------------------------------------------------------------- 输入缓冲
//  所有指针事件只往这个 Float32Array 里写数，一个 wasm 边界都不过。wasm 每帧
//  读一次快照（见 src/input.rs），跨语言调用从 O(事件数) 降到 O(帧数) ——
//  1000 Hz 的游戏鼠标一秒上千次 mousemove，以前就是上千次 wasm 调用。
//
//  槽位必须和 input.rs 里的 I_* 常量一一对应，改一边就得改另一边。
//  末尾留了空位，加字段不用重新分配。
const IN = new Float32Array(16);
const I_X = 0, I_Y = 1;
const I_DOWN = 2, I_RDOWN = 3, I_MDOWN = 4;
const I_CLICK = 5, I_RCLICK = 6, I_MCLICK = 7;
const I_RELEASE = 8, I_RRELEASE = 9, I_MRELEASE = 10;
const I_SCROLL = 11;
// 12/13/14 是拖拽增量，留给以后用：现在 is_dragging / drag_delta 由 wasm 里的
// DragTracker 自己从 down/clicked/released 推，不用 JS 喂。
window.__siiInput = IN;

const canvasEl = document.getElementById('sii-canvas');

function localXY(e) {
  const r = canvasEl.getBoundingClientRect();
  // UI 布局用的是 CSS 逻辑像素，这里不能乘 devicePixelRatio
  IN[I_X] = e.clientX - r.left;
  IN[I_Y] = e.clientY - r.top;
}

canvasEl.addEventListener('pointerdown', e => {
  localXY(e);
  // 拖拽时指针划出画布也要继续收事件，否则松手收不到、mouse_down 永远卡在 1
  try { canvasEl.setPointerCapture(e.pointerId); } catch {}
  if (e.button === 0) { IN[I_DOWN] = 1; IN[I_CLICK] = 1; }
  else if (e.button === 2) { IN[I_RDOWN] = 1; IN[I_RCLICK] = 1; }
  else if (e.button === 1) { IN[I_MDOWN] = 1; IN[I_MCLICK] = 1; }
  e.preventDefault();
});

canvasEl.addEventListener('pointermove', e => localXY(e));

canvasEl.addEventListener('pointerup', e => {
  localXY(e);
  if (e.button === 0) { IN[I_DOWN] = 0; IN[I_RELEASE] = 1; }
  else if (e.button === 2) { IN[I_RDOWN] = 0; IN[I_RRELEASE] = 1; }
  else if (e.button === 1) { IN[I_MDOWN] = 0; IN[I_MRELEASE] = 1; }
});

// 系统抢走指针（切窗口、来电、手势冲突）时补一次松手，不然按钮会卡在按下态
canvasEl.addEventListener('pointercancel', () => {
  IN[I_DOWN] = 0; IN[I_RDOWN] = 0; IN[I_MDOWN] = 0;
});

canvasEl.addEventListener('wheel', e => {
  // 归一化成"格"：不同设备 deltaY 从 1 到 100+ 不等，除 100 让触控板和
  // 鼠标滚轮手感接近。wasm 每帧读完清零，所以这里是累加。
  IN[I_SCROLL] += e.deltaY / 100;
  e.preventDefault();
}, { passive: false });

canvasEl.addEventListener('contextmenu', e => e.preventDefault());

// ---------------------------------------------------------------- DuckDB 桥
const duck = {
  db: null, conn: null, ready: null,

  async init() {
    if (this.ready) return this.ready;
    this.ready = (async () => {
      // 懒加载：不点按钮就不下载 ~30MB 的 duckdb wasm
      const duckdb = await import('https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.29.0/+esm');
      const bundles = duckdb.getJsDelivrBundles();
      const bundle = await duckdb.selectBundle(bundles);
      const workerUrl = URL.createObjectURL(new Blob(
        [`importScripts(${JSON.stringify(bundle.mainWorker)});`],
        { type: 'text/javascript' }
      ));
      const worker = new Worker(workerUrl);
      const logger = new duckdb.ConsoleLogger(duckdb.LogLevel.WARNING);
      this.db = new duckdb.AsyncDuckDB(logger, worker);
      await this.db.instantiate(bundle.mainModule, bundle.pthreadWorker);
      URL.revokeObjectURL(workerUrl);
      this.conn = await this.db.connect();
      return 'ok';
    })();
    return this.ready;
  },

  async exec(sql) {
    await this.init();
    const table = await this.conn.query(sql);
    const rows = [];
    const n = Math.min(table.numRows, 32);
    for (let i = 0; i < n; i++) {
      const row = table.get(i);
      try { rows.push(row.toJSON()); } catch { rows.push({}); }
    }
    return JSON.stringify({ numRows: table.numRows, rows });
  },
};

// ---------------------------------------------------------------- 导出 Worker
//  重编码里最贵的是 NeuQuant 量化（800×600×48 帧实测 1.5 秒）。
//  放到 Worker 后主线程一秒都不卡，代价只是第一次多一次 wasm 实例化。
let wasmApi = null;

let exportWorker = null;
let exportSeq = 0;
const exportPending = new Map();

function getExportWorker() {
  if (exportWorker) return exportWorker;
  const w = new Worker(new URL('./worker.js', import.meta.url), { type: 'module' });

  w.onmessage = (e) => {
    const d = e.data || {};
    if (d.phase === 'ready') return;          // 预热信号，不关任何人的事
    const p = exportPending.get(d.id);
    if (!p) return;
    exportPending.delete(d.id);
    if (d.ok) p.resolve(d.bytes);
    else p.reject(new Error(d.error || '编码失败'));
  };

  // Worker 整体挂了（wasm 加载失败 / 语法错误）时，把所有等待中的任务一起失败掉，
  // 否则状态栏会永远停在"导出中"。
  w.onerror = (ev) => {
    const msg = ev?.message || 'Worker 启动失败';
    for (const [, p] of exportPending) p.reject(new Error(msg));
    exportPending.clear();
    try { w.terminate(); } catch {}
    exportWorker = null;
  };

  exportWorker = w;
  return w;
}

function encodeInWorker(snapshot, speed) {
  const w = getExportWorker();
  const id = ++exportSeq;
  const p = new Promise((resolve, reject) => exportPending.set(id, { resolve, reject }));
  // transfer 快照，主线程这边不留副本
  w.postMessage({ id, type: 'encode', snapshot, speed }, [snapshot.buffer]);
  return p;
}

// ---------------------------------------------------------------- 音频
//  和画面的同步靠一件事：播放期间以 AudioContext.currentTime 为唯一时间源。
//  那是声卡的硬件时钟，和 performance.now() 之间会缓慢漂移（晶振误差，几十
//  ppm 量级）—— 跑十分钟能攒出一帧以上的错位。所以 wasm 每帧问一次"现在播到
//  第几毫秒"，直接按绝对时间查帧表，不做任何累加，误差不累积。
const audio = {
  ctx: null,
  buffer: null,
  node: null,
  startedAt: 0,   // 起播时刻的 ctx.currentTime
  startMs: 0,     // 音频文件内的起点
  endMs: 0,
  playing: false,
  name: '',
  durationMs: 0,

  ctxOrCreate() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
    }
    // 没拿到用户手势之前浏览器会把 AudioContext 挂成 suspended
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },

  async load(file) {
    const ctx = this.ctxOrCreate();
    const raw = await file.arrayBuffer();
    // 老 Safari 只支持回调形式；promise 形式同时传回调会抛 TypeError，
    // 所以两条路都接上，谁先回谁算。
    const decoded = await new Promise((resolve, reject) => {
      const p = ctx.decodeAudioData(raw, resolve, reject);
      if (p && typeof p.then === 'function') p.then(resolve, reject);
    });
    this.stop();
    this.buffer = decoded;
    this.name = file.name;
    this.durationMs = Math.round(decoded.duration * 1000);
    return this.durationMs;
  },

  /// 播 [startMs, endMs)；endMs 为 0 表示播到结尾。返回 false 表示放不了。
  play(startMs, endMs) {
    if (!this.buffer) return false;
    const ctx = this.ctxOrCreate();
    this.stop();

    const dur = this.durationMs;
    const s = Math.max(0, Math.min(Math.round(startMs), dur));
    const e = endMs > 0 ? Math.min(Math.round(endMs), dur) : dur;
    if (e <= s) return false;

    const src = ctx.createBufferSource();
    src.buffer = this.buffer;
    src.connect(ctx.destination);
    // 三个参数：何时开始（0 = 立即）、从音频的第几秒起、播多长。
    // 让浏览器自己截尾，比在 JS 里定时 stop 准 —— 后者要跟渲染抢主线程。
    src.start(0, s / 1000, (e - s) / 1000);

    this.node = src;
    this.startedAt = ctx.currentTime;
    this.startMs = s;
    this.endMs = e;
    this.playing = true;

    src.onended = () => {
      if (this.node !== src) return;   // 已经被 stop 换掉了
      this.node = null;
      this.playing = false;
    };
    return true;
  },

  stop() {
    if (this.node) {
      try { this.node.onended = null; this.node.stop(); } catch {}
      this.node = null;
    }
    this.playing = false;
  },

  /// 当前播到音频文件的第几毫秒；没在播返回 -1。
  /// 这是文件内的绝对位置，含 startMs 偏移，调用方要减掉起点。
  timeMs() {
    if (!this.playing || !this.ctx) return -1;
    return this.startMs + (this.ctx.currentTime - this.startedAt) * 1000;
  },

  progress() {
    if (!this.playing) return 0;
    const span = this.endMs - this.startMs;
    if (span <= 0) return 0;
    return Math.min(1, Math.max(0, (this.timeMs() - this.startMs) / span));
  },
};

function pickAudio() { audioEl.click(); }

audioEl.addEventListener('change', async () => {
  const f = audioEl.files?.[0];
  audioEl.value = '';
  if (!f) return;
  try {
    const dur = await audio.load(f);
    // 总时长只有解码完才知道，回填给 wasm 更新滑块范围
    wasmApi?.audio_loaded(JSON.stringify({ name: f.name, durationMs: dur }));
  } catch (e) {
    console.error('[sii] 音频解码失败', e);
    setBoot('音频解码失败：' + (e?.message ?? e), true);
    setTimeout(hideBoot, 4000);
  }
});

// ---------------------------------------------------------------- 对外桥
const current = { name: 'output.gif' };

window.__sii = {
  duck,
  // wasm 里的 audio.rs 用 js_namespace = ["window","__sii","audio"] 调这几个方法
  audio,
  pickAudio,

  openFile() { fileEl.click(); },

  download(bytes) {
    const blob = new Blob([bytes], { type: 'image/gif' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = current.name.replace(/\.gif$/i, '') + '-edited.gif';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  },

  /// wasm 把快照 + 质量参数丢过来，这里转给 Worker，编完直接落盘。
  async exportAsync(snapshot, speed) {
    const t0 = performance.now();
    try {
      const bytes = await encodeInWorker(snapshot, speed);
      this.download(bytes);
      const ms = Math.round(performance.now() - t0);
      wasmApi?.export_status(
        true,
        `已导出 ${(bytes.byteLength / 1024).toFixed(1)} KB · 后台线程 ${ms} ms`
      );
    } catch (e) {
      wasmApi?.export_status(false, String(e?.message ?? e));
    }
  },
};

// ---------------------------------------------------------------- 文件加载
async function openGifFile(file) {
  if (!file) return;
  if (!/\.gif$/i.test(file.name) && file.type !== 'image/gif') {
    setBoot(`只支持 .gif，收到的是 ${file.type || file.name}`, true);
    return;
  }
  current.name = file.name;
  const buf = await file.arrayBuffer();
  try {
    const summary = wasmApi.load_gif(new Uint8Array(buf), file.name);
    console.log('[sii]', summary);
    hideBoot();
    emptyEl.classList.remove('on');
    // 顺手预热导出 Worker：第一次点"导出"就不用再等 wasm 实例化了
    setTimeout(() => { try { getExportWorker(); } catch {} }, 800);
  } catch (e) {
    setBoot('解码失败：' + (e?.message ?? e), true);
  }
}

fileEl.addEventListener('change', () => {
  openGifFile(fileEl.files?.[0]);
  fileEl.value = '';
});

let dragDepth = 0;
window.addEventListener('dragenter', e => {
  e.preventDefault();
  dragDepth++;
  dropEl.classList.add('on');
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('dragleave', e => {
  e.preventDefault();
  if (--dragDepth <= 0) { dragDepth = 0; dropEl.classList.remove('on'); }
});
window.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  dropEl.classList.remove('on');
  const f = e.dataTransfer?.files?.[0];
  if (f) openGifFile(f);
});

// ---------------------------------------------------------------- 键盘
window.addEventListener('keydown', e => {
  if (!wasmApi) return;
  const tag = (e.target?.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  wasmApi.key(e.code);
  if (e.code === 'Space') e.preventDefault();
});

// ---------------------------------------------------------------- 启动
(async () => {
  if (!navigator.gpu) {
    bootSpin.style.display = 'none';
    setBoot(
      '这个浏览器没有 WebGPU。\n\n' +
      '需要 Chrome / Edge 113+（桌面版），或者开启 chrome://flags/#enable-unsafe-webgpu。\n' +
      'Safari 需要 18+ 并且手动打开 WebGPU 开关。',
      true
    );
    return;
  }
  try {
    const mod = await import('./pkg/sii.js');
    await mod.default();
    wasmApi = mod;
    await mod.start('sii-canvas');
    // 启动成功就直接收掉启动页。它盖住整个屏幕，留着的话左上角那个
    // 「打开 GIF」按钮根本点不到 —— 用户只能看到一句"点左上角打开"，
    // 然后发现左上角什么都没有。
    hideBoot();
    emptyEl.classList.add('on');
  } catch (e) {
    bootSpin.style.display = 'none';
    setBoot('初始化失败：\n' + (e?.stack || e?.message || e), true);
    console.error(e);
  }
})();
</script>
</body>
</html>
